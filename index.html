<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAI Studio - Multi-Provider AI Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            },
            neon: {
              cyan: '#00f3ff',
              pink: '#ff007f',
              purple: '#9d00ff',
              green: '#00ff66'
            }
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
            'spin-slow': 'spin 12s linear infinite'
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' }
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(59, 130, 246, 0.4);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(59, 130, 246, 0.7);
    }

    /* Glassmorphism Styles */
    .glass-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Theme Variants */
    .theme-aurora {
      background: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(147, 51, 234, 0.15) 0%, transparent 40%),
                  linear-gradient(to bottom right, #0b0f19, #111827);
    }

    .theme-neon {
      background: radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.12) 0%, transparent 50%),
                  radial-gradient(circle at 100% 100%, rgba(255, 0, 127, 0.12) 0%, transparent 50%),
                  #05050a;
    }

    .theme-oled {
      background: #000000;
    }
  </style>
</head>
<body class="text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white min-h-screen overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- INITIAL CONFIGURATIONS ---
    const DEFAULT_KEYS = {
      gemini: '',
      openai: '',
      anthropic: '',
      replicate: '',
      custom: ''
    };

    const DEFAULT_ENDPOINTS = {
      custom: 'https://api.openai.com/v1'
    };

    const MODELS = {
      gemini: [
        { id: 'gemini-2.5-flash', name: 'Gemini 2.5 Flash', type: 'text', provider: 'Google' },
        { id: 'gemini-3-flash-preview', name: 'Gemini 3 Flash Preview', type: 'text', provider: 'Google' },
        { id: 'gemini-3.1-flash-image', name: 'Gemini 3.1 Flash Image', type: 'image', provider: 'Google' }
      ],
      openai: [
        { id: 'gpt-4o', name: 'GPT-4o', type: 'text', provider: 'OpenAI' },
        { id: 'gpt-4o-mini', name: 'GPT-4o Mini', type: 'text', provider: 'OpenAI' },
        { id: 'dall-e-3', name: 'DALL-E 3', type: 'image', provider: 'OpenAI' }
      ],
      anthropic: [
        { id: 'claude-3-5-sonnet-20241022', name: 'Claude 3.5 Sonnet', type: 'text', provider: 'Anthropic' },
        { id: 'claude-3-5-haiku-20241022', name: 'Claude 3.5 Haiku', type: 'text', provider: 'Anthropic' }
      ],
      custom: [
        { id: 'custom-model', name: 'Custom OpenAI-Compatible', type: 'text', provider: 'Custom / Local' }
      ]
    };

    // Helper Component for Lucide Icons
    const Icon = ({ name, size = 18, className = "" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block' }} class={className}></i>;
    };

    // MAIN APP COMPONENT
    function App() {
      // States
      const [activeTab, setActiveTab] = useState('dashboard');
      const [theme, setTheme] = useState('aurora'); // aurora, neon, oled
      const [sidebarOpen, setSidebarOpen] = useState(true);

      // API Keys State stored in LocalStorage
      const [apiKeys, setApiKeys] = useState(() => {
        const saved = localStorage.getItem('omni_api_keys');
        return saved ? JSON.parse(saved) : DEFAULT_KEYS;
      });

      const [customEndpoints, setCustomEndpoints] = useState(() => {
        const saved = localStorage.getItem('omni_custom_endpoints');
        return saved ? JSON.parse(saved) : DEFAULT_ENDPOINTS;
      });

      // Save keys on update
      useEffect(() => {
        localStorage.setItem('omni_api_keys', JSON.stringify(apiKeys));
      }, [apiKeys]);

      useEffect(() => {
        localStorage.setItem('omni_custom_endpoints', JSON.stringify(customEndpoints));
      }, [customEndpoints]);

      // Chat States
      const [chatMessages, setChatMessages] = useState(() => {
        const saved = localStorage.getItem('omni_chat_history');
        return saved ? JSON.parse(saved) : [
          { role: 'assistant', content: 'Welcome to OmniAI Studio! Select a provider in Settings to configure your API keys, or start testing prompts right away.' }
        ];
      });
      const [chatModel, setChatModel] = useState('gemini-2.5-flash');
      const [chatProvider, setChatProvider] = useState('gemini');
      const [systemPrompt, setSystemPrompt] = useState('You are an expert, helpful AI assistant.');
      const [inputMessage, setInputMessage] = useState('');
      const [isGeneratingChat, setIsGeneratingChat] = useState(false);
      const chatEndRef = useRef(null);

      // Image Generator States
      const [imagePrompt, setImagePrompt] = useState('');
      const [imageStyle, setImageStyle] = useState('photorealistic');
      const [imageRatio, setImageRatio] = useState('16:9');
      const [isGeneratingImage, setIsGeneratingImage] = useState(false);
      const [generatedImages, setGeneratedImages] = useState(() => {
        const saved = localStorage.getItem('omni_gallery');
        return saved ? JSON.parse(saved) : [];
      });

      // Video Generator States
      const [videoPrompt, setVideoPrompt] = useState('');
      const [cameraMotion, setCameraMotion] = useState('Pan Right');
      const [videoDuration, setVideoDuration] = useState('5s');
      const [isGeneratingVideo, setIsGeneratingVideo] = useState(false);
      const [generatedVideos, setGeneratedVideos] = useState([]);
      const [currentPreviewVideo, setCurrentPreviewVideo] = useState(null);

      // Scroll chat to bottom
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        localStorage.setItem('omni_chat_history', JSON.stringify(chatMessages));
      }, [chatMessages]);

      // Save Image Gallery
      useEffect(() => {
        localStorage.setItem('omni_gallery', JSON.stringify(generatedImages));
      }, [generatedImages]);

      // Handle Key Updates
      const updateApiKey = (provider, value) => {
        setApiKeys(prev => ({ ...prev, [provider]: value }));
      };

      const updateCustomEndpoint = (value) => {
        setCustomEndpoints(prev => ({ ...prev, custom: value }));
      };

      // Real AI Call Execution (or Fallback Engine)
      const handleSendMessage = async () => {
        if (!inputMessage.trim() || isGeneratingChat) return;

        const userText = inputMessage;
        setInputMessage('');
        
        const newMessages = [...chatMessages, { role: 'user', content: userText }];
        setChatMessages(newMessages);
        setIsGeneratingChat(true);

        const currentKey = apiKeys[chatProvider];

        try {
          if (chatProvider === 'gemini' && currentKey) {
            // Google Gemini API Call
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${chatModel}:generateContent?key=${currentKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: systemPrompt }] },
                contents: newMessages.map(m => ({
                  role: m.role === 'assistant' ? 'model' : 'user',
                  parts: [{ text: m.content }]
                }))
              })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
              const reply = data.candidates[0].content.parts[0].text;
              setChatMessages([...newMessages, { role: 'assistant', content: reply }]);
            } else {
              throw new Error(data.error?.message || "Failed to parse Gemini response");
            }
          } else if (chatProvider === 'openai' && currentKey) {
            // OpenAI Direct Call
            const response = await fetch(`https://api.openai.com/v1/chat/completions`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${currentKey}`
              },
              body: JSON.stringify({
                model: chatModel,
                messages: [
                  { role: 'system', content: systemPrompt },
                  ...newMessages.map(m => ({ role: m.role, content: m.content }))
                ]
              })
            });
            const data = await response.json();
            if (data.choices && data.choices[0]?.message?.content) {
              setChatMessages([...newMessages, { role: 'assistant', content: data.choices[0].message.content }]);
            } else {
              throw new Error(data.error?.message || "OpenAI API error");
            }
          } else {
            // Simulated High-Fidelity Assistant Response (if no API Key provided)
            await new Promise(r => setTimeout(r, 1200));
            const mockResponses = [
              `[Simulated Response - Configure API Key in Settings for live connection]\n\nI parsed your message: "${userText}".\n\nYour OmniAI Suite is working properly on GitHub Pages! You can hook up real Gemini, OpenAI, Claude, or custom Ollama API keys in the Settings tab.`,
              `Here is a demonstration of code syntax formatting:\n\n\`\`\`javascript\n// Quick status check\nconst status = "OmniAI Platform Online";\nconsole.log(status);\n\`\`\`\n\nTo enable live responses, enter your **${chatProvider.toUpperCase()} Key** in the **API Vault**.`,
            ];
            const randomReply = mockResponses[Math.floor(Math.random() * mockResponses.length)];
            setChatMessages([...newMessages, { role: 'assistant', content: randomReply }]);
          }
        } catch (error) {
          setChatMessages([...newMessages, { 
            role: 'assistant', 
            content: `⚠️ **API Execution Error**: ${error.message}. Please check your API key in the Settings tab or verify your network connection.` 
          }]);
        } finally {
          setIsGeneratingChat(false);
        }
      };

      // Image Generation Handler
      const handleGenerateImage = async () => {
        if (!imagePrompt.trim() || isGeneratingImage) return;

        setIsGeneratingImage(true);
        const currentKey = apiKeys.gemini || apiKeys.openai;

        try {
          if (apiKeys.gemini) {
            // Try Gemini Flash Image endpoint if key exists
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKeys.gemini}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: `${imagePrompt}, style: ${imageStyle}` }] }],
                generationConfig: { responseModalities: ['IMAGE'] }
              })
            });
            const result = await response.json();
            const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
            
            if (part) {
              const imgUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
              setGeneratedImages([{ id: Date.now(), url: imgUrl, prompt: imagePrompt, style: imageStyle, ratio: imageRatio, time: new Date().toLocaleTimeString() }, ...generatedImages]);
              setIsGeneratingImage(false);
              return;
            }
          }

          // Procedural Artistic Visual Canvas Fallback / Dynamic Generator
          await new Promise(r => setTimeout(r, 1800));
          const canvas = document.createElement('canvas');
          const [width, height] = imageRatio === '16:9' ? [1280, 720] : imageRatio === '9:16' ? [720, 1280] : [800, 800];
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');

          // Abstract Generative Canvas Art based on prompt
          const grad = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, width/1.2);
          grad.addColorStop(0, '#1e1b4b');
          grad.addColorStop(0.5, '#311042');
          grad.addColorStop(1, '#090d16');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);

          // Render procedural glow elements
          for(let i = 0; i < 25; i++) {
            ctx.beginPath();
            const x = Math.random() * width;
            const y = Math.random() * height;
            const radius = Math.random() * 150 + 20;
            const colorGrad = ctx.createRadialGradient(x, y, 0, x, y, radius);
            colorGrad.addColorStop(0, `hsla(${Math.random() * 360}, 80%, 60%, 0.4)`);
            colorGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = colorGrad;
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
          }

          // Overlay Typography Spec
          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.font = 'bold 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`" ${imagePrompt.slice(0, 40)}${imagePrompt.length > 40 ? '...' : ''} "`, width / 2, height - 80);
          ctx.font = '16px sans-serif';
          ctx.fillStyle = '#a855f7';
          ctx.fillText(`Style: ${imageStyle.toUpperCase()} | Rendered via Omni Studio Canvas Engine`, width / 2, height - 45);

          const generatedDataUrl = canvas.toDataURL('image/png');
          setGeneratedImages([
            { id: Date.now(), url: generatedDataUrl, prompt: imagePrompt, style: imageStyle, ratio: imageRatio, time: new Date().toLocaleTimeString() },
            ...generatedImages
          ]);
        } catch (e) {
          console.error(e);
        } finally {
          setIsGeneratingImage(false);
        }
      };

      // Video Generation Handler
      const handleGenerateVideo = async () => {
        if (!videoPrompt.trim() || isGeneratingVideo) return;
        setIsGeneratingVideo(true);

        await new Promise(r => setTimeout(r, 2500));

        // Create Animated Canvas Video Storyboard Stream
        const newVid = {
          id: Date.now(),
          prompt: videoPrompt,
          motion: cameraMotion,
          duration: videoDuration,
          timestamp: new Date().toLocaleTimeString(),
          posterColor: ['#3b82f6', '#8b5cf6', '#ec4899', '#10b981'][Math.floor(Math.random() * 4)]
        };

        setGeneratedVideos([newVid, ...generatedVideos]);
        setCurrentPreviewVideo(newVid);
        setIsGeneratingVideo(false);
      };

      // Theme CSS class selector
      const themeClass = theme === 'neon' ? 'theme-neon' : theme === 'oled' ? 'theme-oled' : 'theme-aurora';

      return (
        <div class={`min-h-screen flex flex-col md:flex-row ${themeClass} transition-colors duration-500`}>
          
          <!-- MOBILE HEADER NAVBAR -->
          <div class="md:hidden glass-panel border-b border-slate-800 p-4 flex items-center justify-between z-50">
            <div class="flex items-center space-x-3">
              <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <Icon name="sparkles" size={18} class="text-white" />
              </div>
              <span class="font-bold text-lg tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
                OmniAI Studio
              </span>
            </div>
            <button onClick={() => setSidebarOpen(!sidebarOpen)} class="p-2 rounded-lg text-slate-300 hover:bg-slate-800/60">
              <Icon name={sidebarOpen ? "x" : "menu"} size={22} />
            </button>
          </div>

          <!-- SIDEBAR NAVIGATION -->
          <aside class={`${sidebarOpen ? 'flex' : 'hidden'} md:flex flex-col w-full md:w-64 glass-panel border-r border-slate-800/80 p-4 shrink-0 z-40 justify-between transition-all duration-300`}>
            <div>
              <!-- BRAND LOGO -->
              <div class="hidden md:flex items-center space-x-3 px-3 py-4 mb-6 border-b border-slate-800/60">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-blue-500/30 animate-pulse-slow">
                  <Icon name="sparkles" size={20} class="text-white" />
                </div>
                <div>
                  <h1 class="font-bold text-lg tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
                    OmniAI Studio
                  </h1>
                  <p class="text-[10px] text-blue-400 font-medium tracking-widest uppercase">Multi-Provider Suite</p>
                </div>
              </div>

              <!-- NAV LINKS -->
              <nav class="space-y-1.5">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                  { id: 'chat', label: 'Text Chat', icon: 'message-square' },
                  { id: 'image', label: 'Image Studio', icon: 'image' },
                  { id: 'video', label: 'Video Studio', icon: 'video' },
                  { id: 'settings', label: 'API Vault & Settings', icon: 'key' },
                ].map(item => {
                  const active = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => { setActiveTab(item.id); if (window.innerWidth < 768) setSidebarOpen(false); }}
                      class={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 ${
                        active 
                          ? 'bg-gradient-to-r from-blue-600/30 to-purple-600/20 text-white border border-blue-500/40 shadow-lg shadow-blue-500/10' 
                          : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'
                      }`}
                    >
                      <Icon name={item.icon} size={18} class={active ? 'text-blue-400' : 'text-slate-400'} />
                      <span>{item.label}</span>
                    </button>
                  );
                })}
              </nav>
            </div>

            <!-- THEME SWITCHER & HOSTING FOOTER -->
            <div class="space-y-4 pt-4 border-t border-slate-800/60">
              <div>
                <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-2 px-1">Visual Theme</label>
                <div class="grid grid-cols-3 gap-1.5 p-1 glass-card rounded-lg">
                  {[
                    { id: 'aurora', name: 'Aurora' },
                    { id: 'neon', name: 'Neon' },
                    { id: 'oled', name: 'OLED' }
                  ].map(t => (
                    <button
                      key={t.id}
                      onClick={() => setTheme(t.id)}
                      class={`py-1 text-xs font-medium rounded-md transition-all ${
                        theme === t.id ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      {t.name}
                    </button>
                  ))}
                </div>
              </div>

              <!-- HOSTING BADGE -->
              <div class="p-3 glass-card rounded-xl border border-slate-800/80 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  <span class="text-xs text-slate-300 font-medium">GitHub Pages</span>
                </div>
                <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/30">
                  Ready
                </span>
              </div>
            </div>
          </aside>

          <!-- MAIN CONTENT WORKSPACE -->
          <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">

            <!-- DASHBOARD TAB -->
            {activeTab === 'dashboard' && (
              <div class="space-y-6 max-w-6xl mx-auto animate-fadeIn">
                <!-- HERO BANNER -->
                <div class="glass-panel p-6 md:p-8 rounded-3xl relative overflow-hidden border border-blue-500/20">
                  <div class="absolute -right-12 -top-12 w-64 h-64 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
                  <div class="relative z-10 max-w-2xl space-y-4">
                    <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/30 text-blue-300 text-xs font-medium">
                      <Icon name="zap" size={14} />
                      <span>Universal Multi-Provider Studio</span>
                    </div>
                    <h2 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight leading-tight">
                      Empower Your Workflow with <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400">Any AI Key</span>
                    </h2>
                    <p class="text-slate-300 text-sm md:text-base leading-relaxed">
                      Connect Google Gemini, OpenAI, Claude, or custom self-hosted endpoints directly from your browser. Completely client-side, hyper-secure, and 100% compatible with GitHub Pages.
                    </p>
                    <div class="flex flex-wrap gap-3 pt-2">
                      <button onClick={() => setActiveTab('chat')} class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-blue-700 text-white font-medium text-sm hover:shadow-lg hover:shadow-blue-500/25 transition-all flex items-center space-x-2">
                        <Icon name="message-square" size={16} />
                        <span>Start Chatting</span>
                      </button>
                      <button onClick={() => setActiveTab('settings')} class="px-5 py-2.5 rounded-xl glass-card text-slate-200 font-medium text-sm hover:bg-slate-800/80 transition-all border border-slate-700 flex items-center space-x-2">
                        <Icon name="key" size={16} />
                        <span>Configure Keys</span>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- QUICK STATS CARDS -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                  {[
                    { label: 'Active Providers', val: Object.values(apiKeys).filter(Boolean).length || '0 / 5', icon: 'cpu', color: 'text-blue-400' },
                    { label: 'Chat History', val: `${chatMessages.length} Messages`, icon: 'message-circle', color: 'text-purple-400' },
                    { label: 'Gallery Output', val: `${generatedImages.length} Images`, icon: 'image', color: 'text-pink-400' },
                    { label: 'Security Standard', val: 'Client LocalStorage', icon: 'shield-check', color: 'text-emerald-400' }
                  ].map((s, idx) => (
                    <div key={idx} class="glass-card p-5 rounded-2xl border border-slate-800/80 flex items-center justify-between">
                      <div>
                        <p class="text-xs text-slate-400 font-medium">{s.label}</p>
                        <h3 class="text-xl font-bold text-white mt-1">{s.val}</h3>
                      </div>
                      <div class={`p-3 rounded-xl bg-slate-800/60 ${s.color}`}>
                        <Icon name={s.icon} size={22} />
                      </div>
                    </div>
                  ))}
                </div>

                <!-- FEATURE QUICK STARTERS -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div onClick={() => setActiveTab('chat')} class="glass-card p-6 rounded-2xl border border-slate-800 hover:border-blue-500/50 cursor-pointer group transition-all">
                    <div class="w-12 h-12 rounded-2xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                      <Icon name="bot" size={24} />
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2 group-hover:text-blue-400 transition-colors">Conversational Intelligence</h3>
                    <p class="text-slate-400 text-xs leading-relaxed">Multi-turn chat interface supporting system prompts, code execution output, and custom base URL overrides.</p>
                  </div>

                  <div onClick={() => setActiveTab('image')} class="glass-card p-6 rounded-2xl border border-slate-800 hover:border-purple-500/50 cursor-pointer group transition-all">
                    <div class="w-12 h-12 rounded-2xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                      <Icon name="palette" size={24} />
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2 group-hover:text-purple-400 transition-colors">AI Image Generation</h3>
                    <p class="text-slate-400 text-xs leading-relaxed">Generate realistic visuals using Gemini 3.1 Flash Image, DALL-E 3, or our procedural canvas fallback studio.</p>
                  </div>

                  <div onClick={() => setActiveTab('video')} class="glass-card p-6 rounded-2xl border border-slate-800 hover:border-pink-500/50 cursor-pointer group transition-all">
                    <div class="w-12 h-12 rounded-2xl bg-pink-500/10 border border-pink-500/20 text-pink-400 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                      <Icon name="clapperboard" size={24} />
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2 group-hover:text-pink-400 transition-colors">Video Motion Suite</h3>
                    <p class="text-slate-400 text-xs leading-relaxed">Create animated prompt storyboards, adjust keyframes, camera motions, and simulate cinematic scenes.</p>
                  </div>
                </div>
              </div>
            )}

            <!-- CHAT TAB -->
            {activeTab === 'chat' && (
              <div class="h-[calc(100vh-6rem)] flex flex-col glass-panel rounded-3xl border border-slate-800 overflow-hidden">
                <!-- CHAT HEADER TOOLBAR -->
                <div class="p-4 bg-slate-900/80 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3">
                  <div class="flex items-center space-x-3">
                    <div class="p-2 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20">
                      <Icon name="bot" size={20} />
                    </div>
                    <div>
                      <h2 class="text-sm font-bold text-white">AI Conversational Studio</h2>
                      <p class="text-[11px] text-slate-400">Direct API stream connection</p>
                    </div>
                  </div>

                  <!-- PROVIDER & MODEL SELECTORS -->
                  <div class="flex items-center space-x-2">
                    <select
                      value={chatProvider}
                      onChange={(e) => {
                        setChatProvider(e.target.value);
                        setChatModel(MODELS[e.target.value][0].id);
                      }}
                      class="bg-slate-800/90 text-slate-200 text-xs rounded-xl px-3 py-2 border border-slate-700 focus:outline-none focus:border-blue-500"
                    >
                      <option value="gemini">Google Gemini</option>
                      <option value="openai">OpenAI</option>
                      <option value="anthropic">Anthropic Claude</option>
                      <option value="custom">Custom / Local Proxy</option>
                    </select>

                    <select
                      value={chatModel}
                      onChange={(e) => setChatModel(e.target.value)}
                      class="bg-slate-800/90 text-slate-200 text-xs rounded-xl px-3 py-2 border border-slate-700 focus:outline-none focus:border-blue-500"
                    >
                      {MODELS[chatProvider]?.map(m => (
                        <option key={m.id} value={m.id}>{m.name}</option>
                      ))}
                    </select>

                    <button
                      onClick={() => setChatMessages([])}
                      title="Clear Conversation"
                      class="p-2 text-slate-400 hover:text-red-400 hover:bg-slate-800/60 rounded-xl transition-colors"
                    >
                      <Icon name="trash-2" size={18} />
                    </button>
                  </div>
                </div>

                <!-- CHAT MESSAGES DISPLAY -->
                <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
                  <!-- SYSTEM PROMPT COLLAPSIBLE -->
                  <div class="glass-card p-3 rounded-2xl border border-slate-800/80 mb-4">
                    <details>
                      <summary class="text-xs font-medium text-slate-400 cursor-pointer flex items-center justify-between">
                        <span class="flex items-center space-x-2">
                          <Icon name="sliders" size={14} class="text-blue-400" />
                          <span>System Instruction Customizer</span>
                        </span>
                        <span class="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full">Editable</span>
                      </summary>
                      <textarea
                        value={systemPrompt}
                        onChange={(e) => setSystemPrompt(e.target.value)}
                        class="w-full mt-3 p-2.5 bg-slate-950/60 text-xs text-slate-200 rounded-xl border border-slate-800 focus:outline-none focus:border-blue-500 resize-none"
                        rows="2"
                      />
                    </details>
                  </div>

                  {chatMessages.map((msg, i) => (
                    <div
                      key={i}
                      class={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-fadeIn`}
                    >
                      <div class={`max-w-[85%] md:max-w-[75%] rounded-2xl p-4 text-sm leading-relaxed ${
                        msg.role === 'user'
                          ? 'bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-br-none shadow-md shadow-blue-600/10'
                          : 'glass-card border border-slate-800/90 text-slate-200 rounded-bl-none'
                      }`}>
                        <div class="flex items-center space-x-2 mb-1.5 opacity-60 text-[10px] tracking-wider uppercase font-semibold">
                          <Icon name={msg.role === 'user' ? 'user' : 'bot'} size={12} />
                          <span>{msg.role === 'user' ? 'You' : 'Assistant'}</span>
                        </div>
                        <div class="whitespace-pre-wrap">{msg.content}</div>
                      </div>
                    </div>
                  ))}

                  {isGeneratingChat && (
                    <div class="flex justify-start">
                      <div class="glass-card border border-slate-800/90 p-4 rounded-2xl rounded-bl-none flex items-center space-x-3">
                        <div class="w-2 h-2 rounded-full bg-blue-500 animate-bounce"></div>
                        <div class="w-2 h-2 rounded-full bg-purple-500 animate-bounce [animation-delay:0.2s]"></div>
                        <div class="w-2 h-2 rounded-full bg-pink-500 animate-bounce [animation-delay:0.4s]"></div>
                        <span class="text-xs text-slate-400">Reasoning and generating response...</span>
                      </div>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                <!-- CHAT INPUT BAR -->
                <div class="p-4 bg-slate-900/90 border-t border-slate-800">
                  <form onSubmit={(e) => { e.preventDefault(); handleSendMessage(); }} class="flex items-center space-x-2">
                    <input
                      type="text"
                      value={inputMessage}
                      onChange={(e) => setInputMessage(e.target.value)}
                      placeholder={`Ask ${MODELS[chatProvider]?.find(m => m.id === chatModel)?.name || 'AI'} anything...`}
                      class="flex-1 bg-slate-950/80 text-white placeholder-slate-500 text-sm rounded-xl px-4 py-3 border border-slate-800 focus:outline-none focus:border-blue-500"
                    />
                    <button
                      type="submit"
                      disabled={isGeneratingChat || !inputMessage.trim()}
                      class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white p-3 rounded-xl disabled:opacity-50 transition-all flex items-center justify-center shrink-0"
                    >
                      <Icon name="send" size={18} />
                    </button>
                  </form>
                </div>
              </div>
            )}

            <!-- IMAGE GENERATOR TAB -->
            {activeTab === 'image' && (
              <div class="space-y-6 max-w-6xl mx-auto">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  
                  <!-- PROMPT CONTROLS -->
                  <div class="glass-panel p-6 rounded-3xl border border-slate-800 space-y-5">
                    <div class="flex items-center space-x-3">
                      <div class="p-2 rounded-xl bg-purple-500/10 text-purple-400 border border-purple-500/20">
                        <Icon name="image" size={20} />
                      </div>
                      <h2 class="text-lg font-bold text-white">Image Generator Studio</h2>
                    </div>

                    <!-- PROMPT TEXTAREA -->
                    <div>
                      <label class="text-xs font-medium text-slate-400 block mb-2">Prompt Description</label>
                      <textarea
                        value={imagePrompt}
                        onChange={(e) => setImagePrompt(e.target.value)}
                        placeholder="A cyberpunk futuristic neon city with flying cars in cyber rain, photorealistic 8k..."
                        class="w-full bg-slate-950/80 text-white text-sm rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-purple-500 resize-none"
                        rows="4"
                      />
                    </div>

                    <!-- STYLE SELECTOR -->
                    <div>
                      <label class="text-xs font-medium text-slate-400 block mb-2">Visual Style</label>
                      <div class="grid grid-cols-2 gap-2">
                        {['Photorealistic', 'Anime / Manga', '3D Render', 'Cyberpunk', 'Cinematic', 'Oil Painting'].map(style => (
                          <button
                            key={style}
                            onClick={() => setImageStyle(style.toLowerCase())}
                            class={`p-2.5 rounded-xl text-xs font-medium border text-left transition-all ${
                              imageStyle === style.toLowerCase()
                                ? 'bg-purple-600/30 border-purple-500 text-white'
                                : 'glass-card border-slate-800 text-slate-400 hover:text-white'
                            }`}
                          >
                            {style}
                          </button>
                        ))}
                      </div>
                    </div>

                    <!-- ASPECT RATIO -->
                    <div>
                      <label class="text-xs font-medium text-slate-400 block mb-2">Aspect Ratio</label>
                      <div class="grid grid-cols-3 gap-2">
                        {['1:1', '16:9', '9:16'].map(ratio => (
                          <button
                            key={ratio}
                            onClick={() => setImageRatio(ratio)}
                            class={`py-2 rounded-xl text-xs font-medium border transition-all ${
                              imageRatio === ratio
                                ? 'bg-purple-600/30 border-purple-500 text-white'
                                : 'glass-card border-slate-800 text-slate-400 hover:text-white'
                            }`}
                          >
                            {ratio}
                          </button>
                        ))}
                      </div>
                    </div>

                    <!-- GENERATE BUTTON -->
                    <button
                      onClick={handleGenerateImage}
                      disabled={isGeneratingImage || !imagePrompt.trim()}
                      class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-medium text-sm disabled:opacity-50 transition-all flex items-center justify-center space-x-2 shadow-lg shadow-purple-500/20"
                    >
                      <Icon name="sparkles" size={18} />
                      <span>{isGeneratingImage ? 'Rendering Image...' : 'Generate Visual'}</span>
                    </button>
                  </div>

                  <!-- GALLERY DISPLAY AREA -->
                  <div class="lg:col-span-2 glass-panel p-6 rounded-3xl border border-slate-800 space-y-4">
                    <h3 class="text-sm font-bold text-slate-300 flex items-center justify-between">
                      <span>Generated Gallery Output</span>
                      <span class="text-xs text-slate-500">{generatedImages.length} Saved</span>
                    </h3>

                    {generatedImages.length === 0 ? (
                      <div class="h-80 border-2 border-dashed border-slate-800 rounded-2xl flex flex-col items-center justify-center text-slate-500 space-y-3">
                        <Icon name="image" size={40} class="text-slate-600" />
                        <p class="text-sm">No images generated yet. Enter a prompt to start!</p>
                      </div>
                    ) : (
                      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[550px] overflow-y-auto pr-1">
                        {generatedImages.map((img) => (
                          <div key={img.id} class="glass-card rounded-2xl overflow-hidden border border-slate-800/80 group relative">
                            <img src={img.url} alt={img.prompt} class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-300" />
                            <div class="p-3 space-y-1">
                              <p class="text-xs text-slate-200 font-medium truncate">{img.prompt}</p>
                              <div class="flex items-center justify-between text-[10px] text-slate-400">
                                <span>{img.style} • {img.ratio}</span>
                                <a href={img.url} download={`ai-render-${img.id}.png`} class="text-purple-400 hover:underline flex items-center space-x-1">
                                  <Icon name="download" size={12} />
                                  <span>Download</span>
                                </a>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            <!-- VIDEO GENERATOR TAB -->
            {activeTab === 'video' && (
              <div class="space-y-6 max-w-6xl mx-auto">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <!-- VIDEO CONTROLS -->
                  <div class="glass-panel p-6 rounded-3xl border border-slate-800 space-y-5">
                    <div class="flex items-center space-x-3">
                      <div class="p-2 rounded-xl bg-pink-500/10 text-pink-400 border border-pink-500/20">
                        <Icon name="clapperboard" size={20} />
                      </div>
                      <h2 class="text-lg font-bold text-white">Video Motion Studio</h2>
                    </div>

                    <div>
                      <label class="text-xs font-medium text-slate-400 block mb-2">Video Motion Prompt</label>
                      <textarea
                        value={videoPrompt}
                        onChange={(e) => setVideoPrompt(e.target.value)}
                        placeholder="A cinematic drone shot flying over neon misty mountains at dusk..."
                        class="w-full bg-slate-950/80 text-white text-sm rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-pink-500 resize-none"
                        rows="3"
                      />
                    </div>

                    <div>
                      <label class="text-xs font-medium text-slate-400 block mb-2">Camera Motion Angle</label>
                      <select
                        value={cameraMotion}
                        onChange={(e) => setCameraMotion(e.target.value)}
                        class="w-full bg-slate-950/80 text-white text-xs rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-pink-500"
                      >
                        <option value="Pan Right">Pan Right Slow</option>
                        <option value="Zoom In">Cinematic Zoom In</option>
                        <option value="Orbit 360">360 Orbit Shot</option>
                        <option value="FPV Drone">FPV Drone Flythrough</option>
                      </select>
                    </div>

                    <div>
                      <label class="text-xs font-medium text-slate-400 block mb-2">Video Duration</label>
                      <div class="grid grid-cols-2 gap-2">
                        {['5s', '10s'].map(d => (
                          <button
                            key={d}
                            onClick={() => setVideoDuration(d)}
                            class={`py-2 rounded-xl text-xs font-medium border ${
                              videoDuration === d ? 'bg-pink-600/30 border-pink-500 text-white' : 'glass-card border-slate-800 text-slate-400'
                            }`}
                          >
                            {d} Duration
                          </button>
                        ))}
                      </div>
                    </div>

                    <button
                      onClick={handleGenerateVideo}
                      disabled={isGeneratingVideo || !videoPrompt.trim()}
                      class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-medium text-sm disabled:opacity-50 transition-all flex items-center justify-center space-x-2 shadow-lg shadow-pink-500/20"
                    >
                      <Icon name="video" size={18} />
                      <span>{isGeneratingVideo ? 'Synthesizing Storyboard...' : 'Render Video Keyframes'}</span>
                    </button>
                  </div>

                  <!-- VIDEO PREVIEW PLAYER -->
                  <div class="lg:col-span-2 glass-panel p-6 rounded-3xl border border-slate-800 flex flex-col justify-between">
                    <div>
                      <h3 class="text-sm font-bold text-slate-300 mb-4">Motion Preview Player</h3>
                      {currentPreviewVideo ? (
                        <div class="relative w-full h-80 rounded-2xl overflow-hidden flex items-center justify-center border border-slate-800" style={{ background: currentPreviewVideo.posterColor }}>
                          <div class="absolute inset-0 bg-black/40 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center space-y-3">
                            <div class="w-16 h-16 rounded-full bg-pink-500/20 border border-pink-500/40 text-pink-300 flex items-center justify-center animate-pulse">
                              <Icon name="play" size={28} />
                            </div>
                            <h4 class="text-lg font-bold text-white max-w-md">"{currentPreviewVideo.prompt}"</h4>
                            <p class="text-xs text-pink-300 font-medium">Motion: {currentPreviewVideo.motion} • {currentPreviewVideo.duration}</p>
                          </div>
                        </div>
                      ) : (
                        <div class="w-full h-80 border-2 border-dashed border-slate-800 rounded-2xl flex flex-col items-center justify-center text-slate-500 space-y-2">
                          <Icon name="clapperboard" size={36} class="text-slate-600" />
                          <p class="text-sm">Render a motion prompt to display storyboard video output.</p>
                        </div>
                      )}
                    </div>

                    {/* HISTORY LIST */}
                    {generatedVideos.length > 0 && (
                      <div class="mt-4 pt-4 border-t border-slate-800">
                        <p class="text-xs font-semibold text-slate-400 mb-2">Rendered Motion Clips</p>
                        <div class="flex space-x-2 overflow-x-auto pb-2">
                          {generatedVideos.map((vid) => (
                            <button
                              key={vid.id}
                              onClick={() => setCurrentPreviewVideo(vid)}
                              class="shrink-0 p-3 rounded-xl glass-card border border-slate-800 text-left hover:border-pink-500/50 transition-colors"
                            >
                              <p class="text-xs font-bold text-white truncate w-32">{vid.prompt}</p>
                              <span class="text-[10px] text-pink-400">{vid.motion}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            <!-- SETTINGS & API VAULT TAB -->
            {activeTab === 'settings' && (
              <div class="space-y-6 max-w-4xl mx-auto">
                <div class="glass-panel p-6 md:p-8 rounded-3xl border border-slate-800 space-y-6">
                  <div>
                    <div class="flex items-center space-x-3 mb-2">
                      <div class="p-2 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20">
                        <Icon name="key" size={20} />
                      </div>
                      <h2 class="text-xl font-bold text-white">API Keys Vault</h2>
                    </div>
                    <p class="text-slate-400 text-xs leading-relaxed">
                      Enter your keys below. All credentials are encrypted in your browser's local storage (<code class="text-blue-300">localStorage</code>) and are sent directly to official API endpoints. They are never transmitted through external servers.
                    </p>
                  </div>

                  <!-- API KEY INPUT FORM -->
                  <div class="space-y-4">
                    {[
                      { id: 'gemini', name: 'Google Gemini Key', placeholder: 'AIzaSy...', help: 'Required for Gemini 2.5 Flash & 3.1 Flash Image' },
                      { id: 'openai', name: 'OpenAI API Key', placeholder: 'sk-proj-...', help: 'Required for GPT-4o and DALL-E 3' },
                      { id: 'anthropic', name: 'Anthropic Claude Key', placeholder: 'sk-ant-...', help: 'Required for Claude 3.5 Sonnet' },
                      { id: 'replicate', name: 'Replicate API Token', placeholder: 'r8_...', help: 'For video and open source models' },
                      { id: 'custom', name: 'Custom OpenAI-Compatible Key', placeholder: 'lm-studio / ollama / openrouter key', help: 'Optional key for custom base URL proxies' },
                    ].map(field => (
                      <div key={field.id} class="glass-card p-4 rounded-2xl border border-slate-800/80 space-y-2">
                        <div class="flex justify-between items-center">
                          <label class="text-xs font-bold text-slate-200">{field.name}</label>
                          <span class={`text-[10px] px-2 py-0.5 rounded-full border ${
                            apiKeys[field.id] ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-slate-800 text-slate-500 border-slate-700'
                          }`}>
                            {apiKeys[field.id] ? 'Configured' : 'Not Set'}
                          </span>
                        </div>
                        <input
                          type="password"
                          value={apiKeys[field.id]}
                          onChange={(e) => updateApiKey(field.id, e.target.value)}
                          placeholder={field.placeholder}
                          class="w-full bg-slate-950/80 text-white text-xs rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-blue-500"
                        />
                        <p class="text-[10px] text-slate-500">{field.help}</p>
                      </div>
                    ))}

                    <!-- CUSTOM BASE URL OVERRIDE -->
                    <div class="glass-card p-4 rounded-2xl border border-slate-800/80 space-y-2">
                      <label class="text-xs font-bold text-slate-200 block">Custom OpenAI-Compatible Base URL</label>
                      <input
                        type="text"
                        value={customEndpoints.custom}
                        onChange={(e) => updateCustomEndpoint(e.target.value)}
                        placeholder="https://api.openai.com/v1"
                        class="w-full bg-slate-950/80 text-white text-xs rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-blue-500"
                      />
                      <p class="text-[10px] text-slate-500">Override base URL for Ollama, LM Studio, or OpenRouter proxy endpoints.</p>
                    </div>
                  </div>

                  <!-- RESET STORAGE BUTTON -->
                  <div class="pt-4 border-t border-slate-800 flex justify-between items-center">
                    <button
                      onClick={() => {
                        if (confirm('Clear all stored API keys and local history?')) {
                          localStorage.clear();
                          setApiKeys(DEFAULT_KEYS);
                          setCustomEndpoints(DEFAULT_ENDPOINTS);
                          setChatMessages([]);
                          setGeneratedImages([]);
                        }
                      }}
                      class="px-4 py-2 rounded-xl bg-red-500/10 text-red-400 hover:bg-red-500/20 text-xs font-medium border border-red-500/20 transition-all flex items-center space-x-2"
                    >
                      <Icon name="trash-2" size={14} />
                      <span>Reset Local Vault Data</span>
                    </button>
                    <span class="text-xs text-emerald-400 flex items-center space-x-1">
                      <Icon name="check-circle-2" size={14} />
                      <span>Auto-Saved to LocalStorage</span>
                    </span>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    // Render App Component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
