<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NullDen</title>
<meta name="description" content="Free browser games. No sign-up needed.">
<meta name="theme-color" content="#0a0c1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NullDen">
<!-- Link previews: replace YOUR-USERNAME and YOUR-REPO with your real GitHub Pages address -->

<meta property="og:site_name" content="NullDen">

<meta property="og:url" content="https://YOUR-USERNAME.github.io/YOUR-REPO/">

<link rel="icon" id="fav" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎮%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"><i></i><i></i><i></i></div>
<div id="gate" hidden>
  <div class="gcard">
    <h1>Welcome to NullDen</h1>
    <p>Please review and accept our terms to continue. Nothing else loads until you do.</p>
    <ul>
      <li>Games are made by third parties and some show ads.</li>
      <li>Your settings stay on your device.</li>
      <li>Don’t share personal info with games.</li>
    </ul>
    <label class="row"><input type="checkbox" id="ok"> <span>I’m 13 or older and I agree to the <a href="terms.html">Terms of Service</a>, <a href="privacy.html">Privacy Policy</a> and <a href="security.html">Security notes</a>.</span></label>
    <button class="btn" id="yes" disabled>Accept and continue</button>
    <button id="no">Leave</button>
  </div>
</div>
<div id="app" hidden>
  <header>
    <div class="brand"><b class="logo" id="logo">NullDen</b><svg class="spin" viewBox="0 0 100 100" role="img" aria-label="Over 2000+ games"><circle class="r" cx="50" cy="50" r="48"/><defs><path id="cc" d="M50,50 m-37,0 a37,37 0 1,1 74,0 a37,37 0 1,1 -74,0"/></defs><g><text><textPath href="#cc" textLength="230" lengthAdjust="spacing">OVER 2000+ GAMES • OVER 2000+ GAMES • </textPath></text></g><text class="c" x="50" y="58" text-anchor="middle">🎮</text></svg></div>
    <nav id="nav">
      <button data-p="games" data-i="🎮" class="on">Games</button>
      <button data-p="shop" data-i="🛒">Shop</button>
      <button data-p="players" data-i="🔎">Players</button>
      <button data-p="account" data-i="👤">Account</button>
      <button data-p="settings" data-i="⚙️">Settings</button>
    </nav>
    <button id="bux">Log in</button>
  </header>
  <div id="notes"></div>
  <main id="view"></main>
  <footer>© 2026 NullDen Games · <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a> · <a href="security.html">Security</a></footer>
  <div id="player" hidden>
    <div class="bar"><b id="pt"></b><small id="ptm"></small><span><button id="pl">Copy link</button><button id="pr">Reload</button><button id="ph">Hide bar</button><button id="po" hidden>Open in new tab</button><button id="pf">Fullscreen</button><button id="px">Close</button></span></div>
    <div id="stage"></div>
    <button id="ps">▾ Show bar</button>
  </div>
</div>
<canvas id="sparks"></canvas>
<noscript><p style="padding:24px;color:#fff">NullDen needs JavaScript.</p></noscript>
<script>
// Consent gate: until the terms are accepted, no fonts, scripts, images or game data are requested.
(function(){var TV='2026-4',ok=0;try{ok=localStorage.nd_terms==TV}catch(e){}
var g=document.getElementById('gate'),a=document.getElementById('app');
function start(){g.hidden=true;a.hidden=false;
var f=document.createElement('link');f.rel='stylesheet';f.href='https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&display=swap';document.head.appendChild(f);
[['manifest','manifest.webmanifest'],['apple-touch-icon','icon-192.png']].forEach(function(x){var l=document.createElement('link');l.rel=x[0];l.href=x[1];document.head.appendChild(l)});
['games.js','catalog.js','app.js'].forEach(function(s){var e=document.createElement('script');e.src=s;e.async=false;document.body.appendChild(e)})}
if(ok)start();else{g.hidden=false;var c=document.getElementById('ok'),y=document.getElementById('yes');
c.onchange=function(){y.disabled=!c.checked};
y.onclick=function(){try{localStorage.nd_terms=TV}catch(e){}start()};
document.getElementById('no').onclick=function(){location.replace('about:blank')}}})();
</script>
</body>
</html>
